name: iOS prototype
run-name: "iOS | source=${{ inputs.reuse_run || 'build' }} | mode=${{ inputs.network_probe && 'network' || inputs.recheck_playback && 'playback' || inputs.recheck_iphone && 'iphone' || inputs.reuse_run && 'ipad' || 'build' }} | codec=${{ inputs.network_codec || 'h264' }} | ipad=${{ inputs.check_ipad && 'yes' || 'no' }} | stage=${{ inputs.ui_stage || 'all' }} | scope=${{ inputs.check_scope || 'full' }}"

on:
  push:
    branches: [master, 'codex/**']
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md']
  workflow_dispatch:
    inputs:
      check_scope:
        description: 'Simulator verification scope (build and type checks always run for new builds)'
        required: false
        default: full
        type: choice
        options: [full, zoom-font, ts-comments, recovery-ui, streaming, encoded-seek, av1-decoder, startup-preroll, aether-compare, avplayer-compare, aether-seek, decode-trial, checkpoint-trial, checkpoint-player, checkpoint-analysis]
      network_codec:
        description: 'Synthetic codec for network fault checks (same app binary)'
        required: false
        default: h264
        type: choice
        options: [h264, av1]
      network_probe:
        description: 'Recheck only controlled network faults on an unchanged built simulator app'
        required: false
        default: false
        type: boolean
      check_ipad:
        description: 'Also run iPad simulator UI checks'
        required: false
        default: false
        type: boolean
      reuse_run:
        description: 'Completed build run to reuse for iPad UI verification (optional)'
        required: false
        default: ''
        type: string
      recheck_playback:
        description: 'Run all playback and iPhone/iPad checks again on the unchanged built application'
        required: false
        default: false
        type: boolean
      recheck_iphone:
        description: 'Recheck iPhone UI tests using the unchanged reused binary'
        required: false
        default: false
        type: boolean
      ui_stage:
        description: 'Optional single iPhone UI stage to recheck'
        required: false
        default: all
        type: choice
        options: [all, recorded, pagination, detail, record-actions, detail-actions, play-popup, list-actions, drop-dialog, menu, settings, gestures]

permissions:
  contents: read
  actions: read

concurrency:
  # Rechecks must not cancel a build, nor a running check of another binary.
  group: ios-${{ github.ref }}-${{ inputs.reuse_run || 'build' }}-${{ inputs.network_probe && 'network' || inputs.reuse_run && 'ui' || 'build' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check for equivalent completed verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate CI helpers
        run: python3 -m unittest discover -s tests/ci -v
      - name: Avoid duplicate successful verification
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-support.py guard
      - name: Compile reference classifiers and check conservative guards
        if: ${{ steps.guard.outputs.proceed == 'true' && !inputs.reuse_run && contains(fromJSON('["encoded-seek","av1-decoder","startup-preroll"]'), inputs.check_scope) }}
        run: python3 scripts/preroll-reference-test.py --guards-only
      - uses: actions/upload-artifact@v4
        if: ${{ steps.guard.outputs.proceed == 'true' && !inputs.reuse_run && contains(fromJSON('["encoded-seek","av1-decoder","startup-preroll"]'), inputs.check_scope) }}
        with:
          name: Preroll-classifier-guards
          path: dist/preroll-reference-test.json

  native-library:
    needs: preflight
    if: ${{ needs.preflight.outputs.proceed == 'true' && !inputs.reuse_run }}
    uses: ./.github/workflows/vlckit.yml

  build:
    needs: [preflight, native-library]
    if: ${{ needs.preflight.outputs.proceed == 'true' && !inputs.reuse_run }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NETWORK_CODEC: ${{ inputs.network_codec || 'h264' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        id: ruby
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Environment
        id: environment
        run: |
          xcodebuild -version
          bundle exec pod --version
      - name: Prepare synthetic picture verification
        if: ${{ inputs.check_scope == 'aether-compare' || inputs.check_scope == 'avplayer-compare' || inputs.check_scope == 'aether-seek' || inputs.check_scope == 'checkpoint-player' }}
        run: |
          mkdir -p dist
          xcrun swiftc scripts/check-aether-picture.swift -o dist/aether-picture-check
          dist/aether-picture-check tests/fixtures/aether-seek-reference/av1-seek-10.mkv-20.png tests/fixtures/aether-seek-reference av1-seek-10.mkv 20 > dist/aether-picture-positive.json
          dist/aether-picture-check tests/fixtures/aether-seek-reference/av1-seek-10.mkv-20.png tests/fixtures/aether-seek-reference av1-seek-10.mkv 30 > dist/aether-picture-negative.json
          python3 -c "import json; assert json.load(open('dist/aether-picture-positive.json'))['targetMatches']; assert not json.load(open('dist/aether-picture-negative.json'))['targetMatches']"
      - name: Check adaptive checkpoint placement policy
        if: ${{ inputs.check_scope == 'checkpoint-player' }}
        run: |
          mkdir -p build/native-tests dist
          swiftc ios/NeoEPGStation/NeoCheckpointPlacement.swift tests/checkpoint-placement/main.swift -o build/native-tests/checkpoint-placement
          build/native-tests/checkpoint-placement > dist/checkpoint-placement.txt
      - name: Check checkpoint analysis completion policy
        if: ${{ inputs.check_scope == 'checkpoint-analysis' }}
        run: |
          mkdir -p build/native-tests dist
          swiftc -parse-as-library ios/NeoEPGStation/NeoPlaybackExperiment.swift tests/checkpoint-analysis/main.swift -o build/native-tests/checkpoint-analysis
          build/native-tests/checkpoint-analysis > dist/checkpoint-analysis.txt
      - name: Native ASS parser and playback clock tests
        id: native-tests
        run: |
          mkdir -p build/native-tests
          task_checks_failed=0
          swiftc ios/NeoEPGStation/NeoASSComments.swift ios/NeoEPGStation/NeoCommentLoader.swift ios/NeoEPGStation/NeoCommentLayout.swift ios/NeoEPGStation/NeoMediaByteClock.swift ios/NeoEPGStation/NeoPlaybackHistory.swift ios/NeoEPGStation/NeoVideoRecovery.swift tests/native/main.swift -o build/native-tests/comments && build/native-tests/comments || task_checks_failed=1
          swiftc ios/NeoEPGStation/NeoPlaybackExperiment.swift tests/experiment/main.swift -o build/native-tests/experiment && build/native-tests/experiment || task_checks_failed=1
          swiftc ios/NeoEPGStation/NeoPlaybackExperiment.swift ios/NeoEPGStation/NeoModels.swift tests/ui/main.swift -o build/native-tests/ui && build/native-tests/ui || task_checks_failed=1
          swiftc ios/NeoEPGStation/NeoPlaybackExperiment.swift ios/NeoEPGStation/NeoModels.swift ios/NeoEPGStation/NeoHLSManifest.swift tests/streaming/main.swift -o build/native-tests/hls && build/native-tests/hls || task_checks_failed=1
          swiftc ios/NeoEPGStation/NeoHTTPByteStream.swift tests/progressive/main.swift -o build/native-tests/progressive && build/native-tests/progressive || task_checks_failed=1
          swiftc ios/NeoEPGStation/NeoPlaybackDiagnostics.swift tests/buffering/main.swift -o build/native-tests/buffering && build/native-tests/buffering || task_checks_failed=1
          exit "$task_checks_failed"
      - name: Native UI type checks
        id: type-checks
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: |
          # Swift (including the SPM engine adapter) is checked by both Xcode builds below.
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun clang -fsyntax-only -fobjc-arc -target arm64-apple-ios18.0-simulator \
            -isysroot "$sdk" ios/NeoEPGStation/NeoVLCFrameTap.m
      - name: Prepare simulator
        id: simulator
        run: python3 scripts/simulator-smoke.py --prepare
      - name: Retrieve AV1 device framework
        uses: actions/download-artifact@v4
        with:
          name: VLCKit-iphoneos
          path: build/vlckit-output-iphoneos
      - name: Retrieve AV1 simulator framework
        uses: actions/download-artifact@v4
        with:
          name: VLCKit-iphonesimulator
          path: build/vlckit-output-iphonesimulator
      - name: Verify and assemble local dependency
        run: |
          python3 scripts/verify-vlckit.py iphoneos --required
          python3 scripts/verify-vlckit.py iphonesimulator --required
          chmod +x build/vlckit-output-*/VLCKit.framework/VLCKit
          xcodebuild -create-xcframework \
            -framework build/vlckit-output-iphoneos/VLCKit.framework \
            -framework build/vlckit-output-iphonesimulator/VLCKit.framework \
            -output vendor/vlckit/VLCKit.xcframework
          cp build/vlckit-output-iphoneos/provenance.json dist/vlckit-device.json
          cp build/vlckit-output-iphonesimulator/provenance.json dist/vlckit-simulator.json
      - name: Install pods
        id: install-pods
        working-directory: ios
        run: bundle exec pod install --deployment
      - name: Cache pinned Swift packages
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: build/SourcePackages
          key: aether-spm-xcode26.6-${{ hashFiles('ios/NeoEPGStation.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Resolve pinned comparison engine
        id: aether-dependencies
        run: |
          xcodebuild -resolvePackageDependencies -workspace ios/NeoEPGStation.xcworkspace \
            -scheme NeoEPGStation -clonedSourcePackagesDirPath build/SourcePackages
          python3 scripts/aether-provenance.py
      - name: Retain resolved dependencies before compiling the application
        if: ${{ success() && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - name: Cache isolated checkpoint decoder
        uses: actions/cache@v4
        with:
          path: build/checkpoint
          key: checkpoint-xcode26.6-v1-${{ hashFiles('scripts/build-checkpoint.py', 'scripts/checkpoint_compression_sources.py', 'vendor/checkpoint/**', 'vendor/rcomp-metal/**', 'vendor/lscomp/**', 'experiments/dav1d-checkpoint/*.c', 'experiments/dav1d-checkpoint/*.h') }}
      - name: Build private checkpoint decoder for device and simulator
        run: |
          command -v meson >/dev/null && command -v ninja >/dev/null || brew install meson ninja
          python3 scripts/build-checkpoint.py iphoneos
          python3 scripts/build-checkpoint.py iphonesimulator
      - name: Check GPU compression kernels before application builds
        if: ${{ inputs.check_scope == 'checkpoint-trial' }}
        run: |
          python3 -u scripts/lscomp-metal-smoke.py
          python3 -u scripts/metal-zstd-smoke.py
      - name: Build device application
        id: device-build
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -workspace ios/NeoEPGStation.xcworkspace \
            -scheme NeoEPGStation -configuration Release -clonedSourcePackagesDirPath build/SourcePackages \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee dist/device-build.log | xcbeautify
      - name: Verify device FFmpeg import isolation
        run: python3 scripts/verify-aether-bindings.py build/device/Build/Products/Release-iphoneos/NeoEPGStation.app/NeoEPGStation --output dist/aether-bindings-device.json
      - name: Package LiveContainer IPA
        id: package-ipa
        run: bash scripts/package-ipa.sh
      - name: Build simulator application
        id: simulator-build
        run: |
          set -o pipefail
          xcodebuild -workspace ios/NeoEPGStation.xcworkspace \
            -scheme NeoEPGStation -configuration Release -clonedSourcePackagesDirPath build/SourcePackages \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            CODE_SIGN_LOCAL_EXECUTION_IDENTITY='Ad Hoc' \
            build 2>&1 | tee dist/simulator-build.log | xcbeautify
      - name: Verify simulator FFmpeg import isolation
        run: python3 scripts/verify-aether-bindings.py build/simulator/Build/Products/Release-iphonesimulator/NeoEPGStation.app/NeoEPGStation --output dist/aether-bindings-simulator.json
      - name: Check opt-in Aether playback and rendered seeks
        id: aether-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'aether-compare' }}
        run: |
          comparison_failed=0
          python3 -u scripts/aether-comparison-smoke.py || comparison_failed=1
          python3 -u scripts/encoded-seek-smoke.py --startup || comparison_failed=1
          exit "$comparison_failed"
      - name: Check analysis prefetch waiting and cancellation
        id: checkpoint-analysis-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'checkpoint-analysis' }}
        run: python3 -u scripts/checkpoint-analysis-smoke.py
      - name: Check checkpoint playback on and off with actual target images
        id: checkpoint-player-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'checkpoint-player' }}
        run: python3 -u scripts/aether-comparison-smoke.py --checkpoint-player
      - name: Check AV1 checkpoint diagnostic screen
        id: checkpoint-trial-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'checkpoint-trial' }}
        run: python3 -u scripts/checkpoint-trial-smoke.py
      - name: Check AV1 diagnostic screen and real decoded target frames
        id: decode-trial-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'decode-trial' }}
        run: python3 -u scripts/decode-trial-smoke.py
      - name: Check Aether UI work reduction and per-seek diagnostics
        id: aether-seek-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'aether-seek' }}
        run: python3 -u scripts/aether-comparison-smoke.py --seek-work
      - name: Check direct AVPlayer MP4 playback and target images
        id: avplayer-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'avplayer-compare' }}
        run: python3 -u scripts/avplayer-comparison-smoke.py
      - name: Check encoded PLAY cached seek latency
        id: encoded-seek-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'encoded-seek' }}
        run: |
          python3 -u scripts/encoded-seek-smoke.py --compare-preroll
          python3 -u scripts/encoded-seek-smoke.py --compare-hevc
          python3 -u scripts/encoded-seek-smoke.py --av1
      - name: Check one-shot startup and preroll preparation
        id: startup-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'startup-preroll' }}
        run: python3 -u scripts/encoded-seek-smoke.py --startup
      - name: Check AV1 selection, 8/10-bit playback and accurate cached seeks
        id: av1-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'av1-decoder' }}
        run: python3 -u scripts/encoded-seek-smoke.py --av1
      - name: Check VOD HLS streaming, cache, quality and recovery
        id: streaming-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && (inputs.check_scope == 'streaming' || inputs.check_scope == 'startup-preroll') }}
        run: |
          hls_result=0
          python3 -u scripts/streaming-smoke.py || hls_result=$?
          ts_result=0
          python3 -u scripts/ts-resume-smoke.py || ts_result=$?
          mpeg_result=0
          python3 -u scripts/ts-resume-smoke.py mpeg2 || mpeg_result=$?
          test "$hls_result" = 0 && test "$ts_result" = 0 && test "$mpeg_result" = 0
      - name: Check native playback and iPhone UI
        id: iphone-checks
        if: ${{ inputs.check_scope != 'zoom-font' && inputs.check_scope != 'ts-comments' && inputs.check_scope != 'recovery-ui' && inputs.check_scope != 'streaming' && inputs.check_scope != 'encoded-seek' && inputs.check_scope != 'av1-decoder' && inputs.check_scope != 'startup-preroll' && inputs.check_scope != 'aether-compare' && inputs.check_scope != 'avplayer-compare' && inputs.check_scope != 'aether-seek' && inputs.check_scope != 'decode-trial' && inputs.check_scope != 'checkpoint-trial' && inputs.check_scope != 'checkpoint-player' && inputs.check_scope != 'checkpoint-analysis' }}
        run: python3 -u scripts/simulator-smoke.py --iphone-only
      - name: Check zoom, haptics and comment font diagnostics
        id: zoom-font-checks
        if: ${{ inputs.check_scope == 'zoom-font' || inputs.check_scope == 'ts-comments' }}
        run: python3 -u scripts/zoom-font-smoke.py
      - name: Check TS resume and comment startup
        id: ts-comments-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'ts-comments' }}
        run: |
          python3 -u scripts/ts-resume-smoke.py
          python3 -u scripts/ts-resume-smoke.py mpeg2
      - name: Check repeated UI reflow and fullscreen zoom
        id: reflow-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'recovery-ui' }}
        run: python3 -u scripts/reflow-zoom-smoke.py
      - name: Check long tunnel recovery
        id: tunnel-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope == 'recovery-ui' }}
        env:
          CHECK_SCOPE: recovery-ui
        run: python3 -u scripts/network-recovery-smoke.py
      - name: Compare native ARIB subtitle timing
        id: arib-checks
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.check_scope != 'zoom-font' && inputs.check_scope != 'ts-comments' && inputs.check_scope != 'recovery-ui' && inputs.check_scope != 'streaming' && inputs.check_scope != 'encoded-seek' && inputs.check_scope != 'av1-decoder' && inputs.check_scope != 'startup-preroll' && inputs.check_scope != 'aether-compare' && inputs.check_scope != 'avplayer-compare' && inputs.check_scope != 'aether-seek' && inputs.check_scope != 'decode-trial' && inputs.check_scope != 'checkpoint-trial' && inputs.check_scope != 'checkpoint-player' && inputs.check_scope != 'checkpoint-analysis' }}
        run: python3 -u scripts/arib-timing-smoke.py
      - name: Check iPad UI
        id: ipad-checks
        if: ${{ inputs.check_ipad == true && inputs.check_scope != 'zoom-font' && inputs.check_scope != 'ts-comments' && inputs.check_scope != 'recovery-ui' && inputs.check_scope != 'streaming' && inputs.check_scope != 'encoded-seek' && inputs.check_scope != 'av1-decoder' && inputs.check_scope != 'startup-preroll' && inputs.check_scope != 'aether-compare' && inputs.check_scope != 'avplayer-compare' && inputs.check_scope != 'aether-seek' && inputs.check_scope != 'decode-trial' && inputs.check_scope != 'checkpoint-trial' && inputs.check_scope != 'checkpoint-player' && inputs.check_scope != 'checkpoint-analysis' }}
        run: python3 -u scripts/simulator-smoke.py --ipad-only
      - name: Exercise network loss and recovery through native VLC
        id: network-checks
        if: always() && inputs.check_scope != 'zoom-font' && inputs.check_scope != 'ts-comments' && inputs.check_scope != 'recovery-ui' && inputs.check_scope != 'streaming' && inputs.check_scope != 'encoded-seek' && inputs.check_scope != 'av1-decoder' && inputs.check_scope != 'startup-preroll' && inputs.check_scope != 'aether-compare' && inputs.check_scope != 'avplayer-compare' && inputs.check_scope != 'aether-seek' && inputs.check_scope != 'decode-trial' && inputs.check_scope != 'checkpoint-trial' && inputs.check_scope != 'checkpoint-player' && inputs.check_scope != 'checkpoint-analysis' && hashFiles('build/simulator/Build/Products/Release-iphonesimulator/NeoEPGStation.app/Info.plist') != ''
        run: python3 -u scripts/network-recovery-smoke.py
      - name: Preserve simulator application for UI diagnostics
        id: preserve-simulator
        if: always() && hashFiles('build/simulator/Build/Products/Release-iphonesimulator/NeoEPGStation.app/Info.plist') != ''
        run: |
          ditto -c -k --keepParent build/simulator/Build/Products/Release-iphonesimulator/NeoEPGStation.app dist/simulator-app.zip
      - name: Upload installable IPA
        id: upload-ipa
        if: ${{ !cancelled() && steps.package-ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package-ipa.outputs.ipa_path }}
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostics and simulator application
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoEPGStation-iOS-${{ github.run_number }}
          path: |
            dist/*.sha256
            dist/*.json
            dist/*.log
            dist/*.txt
            dist/*.png
            dist/simulator-app.zip
            dist/AetherEngine-source-recipes.tar.gz
            ios/Podfile.lock
            Gemfile.lock
          retention-days: 7
          if-no-files-found: error
      - name: Summarize build and verification
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_SCOPE: ${{ inputs.check_scope == 'checkpoint-analysis' && 'API analysis generation; detail prefetch; completion waiting; cancellation; automatic routing' || inputs.check_scope == 'checkpoint-player' && 'AV1 actual playback; checkpoint on/off; lookahead; target pixels; bounded state cache' || inputs.check_scope == 'checkpoint-trial' && 'AV1 checkpoint lab; private dav1d; full pixels; repeated restores and footprint; device performance pending' || inputs.check_scope == 'decode-trial' && 'AV1 diagnostic screen; cached identical packets; direct VT and dav1d; target verification; real-device HW measurement pending' || inputs.check_scope == 'aether-seek' && 'Aether UI refresh A/B; cache and AVPlayer seek diagnostics; actual target images' || inputs.check_scope == 'avplayer-compare' && 'AVPlayer direct MP4; H264/HEVC actual target images; AV1 device check required' || inputs.check_scope == 'aether-compare' && 'Aether encoded PLAY; actual output seeks; retained VLC startup' || inputs.check_scope == 'startup-preroll' && 'one-shot startup; full rewind range; preroll preparation costs; HLS/TS positioning' || inputs.check_scope == 'av1-decoder' && 'AV1 OS capability; native selection; 8/10-bit PLAY; cached seeks' || inputs.check_scope == 'encoded-seek' && 'encoded PLAY cached seeks; resume; buffering boundaries' || inputs.check_scope == 'streaming' && 'HLS streaming; segment cache; quality; recovery' || inputs.check_scope == 'recovery-ui' && 'tunnel recovery; reflow; zoom; comment selection' || inputs.check_scope == 'ts-comments' && 'TS resume/comments + zoom/haptic/font' || inputs.check_scope == 'zoom-font' && 'build; zoom/haptic/font only' || 'build; iPhone playback/UI; network' }}; codec=${{ inputs.network_codec || 'h264' }}; iPad=${{ inputs.check_ipad && 'yes' || 'no' }}
        run: python3 scripts/ci-support.py summary

  ipad-ui:
    name: Reused simulator UI checks
    needs: preflight
    if: ${{ needs.preflight.outputs.proceed == 'true' && inputs.reuse_run != '' }}
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      REUSE_RUN: ${{ inputs.reuse_run }}
      UI_STAGE: ${{ inputs.ui_stage }}
      RECHECK_PLAYBACK: ${{ inputs.recheck_playback }}
      CHECK_SCOPE: ${{ inputs.check_scope }}
      NETWORK_PROBE: ${{ inputs.network_probe }}
      NETWORK_CODEC: ${{ inputs.network_codec || 'h264' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve verified simulator application
        id: retrieve
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p reused dist
          gh run view "$REUSE_RUN" --json number,headSha > reused/run.json
          run_number=$(python3 -c 'import json; print(json.load(open("reused/run.json"))["number"])')
          gh run download "$REUSE_RUN" --name "NeoEPGStation-iOS-$run_number" --dir reused/artifact
          python3 scripts/verify-reused-build.py
          ditto -x -k reused/artifact/dist/simulator-app.zip build/simulator/Build/Products/Release-iphonesimulator
          codesign --verify --deep --strict build/simulator/Build/Products/Release-iphonesimulator/NeoEPGStation.app
      - name: Check reused application UI
        id: reused-checks
        run: |
          if [ "$CHECK_SCOPE" = "av1-decoder" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/encoded-seek-smoke.py --av1
          elif [ "$CHECK_SCOPE" = "startup-preroll" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/encoded-seek-smoke.py --startup
            python3 -u scripts/streaming-smoke.py
            python3 -u scripts/ts-resume-smoke.py
            python3 -u scripts/ts-resume-smoke.py mpeg2
          elif [ "$CHECK_SCOPE" = "checkpoint-analysis" ]; then
            mkdir -p build/native-tests
            swiftc -parse-as-library ios/NeoEPGStation/NeoPlaybackExperiment.swift tests/checkpoint-analysis/main.swift -o build/native-tests/checkpoint-analysis
            build/native-tests/checkpoint-analysis > dist/checkpoint-analysis.txt
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/checkpoint-analysis-smoke.py
          elif [ "$CHECK_SCOPE" = "checkpoint-player" ]; then
            mkdir -p build/native-tests
            swiftc scripts/check-aether-picture.swift -o dist/aether-picture-check
            swiftc ios/NeoEPGStation/NeoCheckpointPlacement.swift tests/checkpoint-placement/main.swift -o build/native-tests/checkpoint-placement
            build/native-tests/checkpoint-placement > dist/checkpoint-placement.txt
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/aether-comparison-smoke.py --checkpoint-player
          elif [ "$CHECK_SCOPE" = "checkpoint-trial" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/checkpoint-trial-smoke.py
          elif [ "$CHECK_SCOPE" = "decode-trial" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/decode-trial-smoke.py
          elif [ "$CHECK_SCOPE" = "aether-seek" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/aether-comparison-smoke.py --seek-work
          elif [ "$CHECK_SCOPE" = "avplayer-compare" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/avplayer-comparison-smoke.py
          elif [ "$CHECK_SCOPE" = "aether-compare" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            comparison_failed=0
            python3 -u scripts/aether-comparison-smoke.py || comparison_failed=1
            if [ ! -f dist/reused-vlc-startup.json ]; then
              python3 -u scripts/encoded-seek-smoke.py --startup || comparison_failed=1
            fi
            exit "$comparison_failed"
          elif [ "$CHECK_SCOPE" = "encoded-seek" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/encoded-seek-smoke.py --compare-preroll
            python3 -u scripts/encoded-seek-smoke.py --compare-hevc
            python3 -u scripts/encoded-seek-smoke.py --av1
          elif [ "$CHECK_SCOPE" = "streaming" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/streaming-smoke.py
            python3 -u scripts/ts-resume-smoke.py
            python3 -u scripts/ts-resume-smoke.py mpeg2
          elif [ "$CHECK_SCOPE" = "recovery-ui" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/reflow-zoom-smoke.py
            python3 -u scripts/network-recovery-smoke.py
          elif [ "$CHECK_SCOPE" = "zoom-font" ] || [ "$CHECK_SCOPE" = "ts-comments" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/zoom-font-smoke.py
            if [ "$CHECK_SCOPE" = "ts-comments" ]; then python3 -u scripts/ts-resume-smoke.py; python3 -u scripts/ts-resume-smoke.py mpeg2; fi
          elif [ "$NETWORK_PROBE" = "true" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            device=$(python3 -c 'import json; print(json.load(open("dist/simulator-device.json"))["udid"])')
            xcrun simctl bootstatus "$device" -b
            xcrun simctl install "$device" build/simulator/Build/Products/Release-iphonesimulator/NeoEPGStation.app
            python3 -u scripts/network-recovery-smoke.py
          elif [ "$RECHECK_PLAYBACK" = "true" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            python3 -u scripts/simulator-smoke.py --iphone-only
            python3 -u scripts/arib-timing-smoke.py
            python3 -u scripts/simulator-smoke.py --ipad-only
          elif [ "${{ inputs.recheck_iphone }}" = "true" ]; then
            python3 -u scripts/simulator-smoke.py --prepare
            extra=()
            if [ -n "$UI_STAGE" ] && [ "$UI_STAGE" != "all" ]; then extra+=("--ui-stage=$UI_STAGE"); fi
            iphone_result=0
            python3 -u scripts/simulator-smoke.py --iphone-only --ui-only "${extra[@]}" || iphone_result=$?
            ipad_result=0
            if [ "${{ inputs.check_ipad }}" = "true" ]; then
              python3 -u scripts/simulator-smoke.py --ipad-only || ipad_result=$?
            fi
            test "$iphone_result" = "0" && test "$ipad_result" = "0"
          else
            python3 -u scripts/simulator-smoke.py --prepare --no-boot
            python3 -u scripts/simulator-smoke.py --ipad-only
          fi
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: NeoEPGStation-Reused-UI-${{ github.run_number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Summarize reused application verification
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_SCOPE: ${{ inputs.check_scope == 'checkpoint-analysis' && 'API analysis generation; detail prefetch; completion waiting; cancellation; automatic routing' || inputs.check_scope == 'checkpoint-player' && 'AV1 actual playback; checkpoint on/off; lookahead; target pixels; bounded state cache' || inputs.check_scope == 'checkpoint-trial' && 'AV1 checkpoint lab; private dav1d; full pixels; repeated restores and footprint; device performance pending' || inputs.check_scope == 'decode-trial' && 'AV1 diagnostic screen; cached identical packets; direct VT and dav1d; target verification; real-device HW measurement pending' || inputs.check_scope == 'aether-seek' && 'Aether UI refresh A/B; cache and AVPlayer seek diagnostics; actual target images' || inputs.check_scope == 'avplayer-compare' && 'AVPlayer direct MP4; H264/HEVC actual target images; AV1 device check required' || inputs.check_scope == 'aether-compare' && 'Aether encoded PLAY; actual output seeks; retained VLC startup' || inputs.check_scope == 'startup-preroll' && 'one-shot startup; full rewind range; preroll preparation costs; HLS/TS positioning' || inputs.check_scope == 'av1-decoder' && 'AV1 OS capability; native selection; 8/10-bit PLAY; cached seeks' || inputs.check_scope == 'encoded-seek' && 'encoded PLAY cached seeks; resume; buffering boundaries' || inputs.check_scope == 'streaming' && 'HLS streaming; segment cache; quality; recovery' || inputs.check_scope == 'recovery-ui' && 'tunnel recovery; reflow; zoom; comment selection' || inputs.check_scope == 'ts-comments' && 'TS resume/comments + zoom/haptic/font' || inputs.check_scope == 'zoom-font' && 'zoom/haptic/font only' || inputs.network_probe && 'network' || inputs.recheck_playback && 'playback + iPhone/iPad' || inputs.recheck_iphone && 'iPhone UI' || 'iPad UI' }}; stage=${{ inputs.ui_stage || 'all' }}; codec=${{ inputs.network_codec || 'h264' }}; extra-iPad=${{ inputs.check_ipad && 'yes' || 'no' }}
        run: python3 scripts/ci-support.py summary
