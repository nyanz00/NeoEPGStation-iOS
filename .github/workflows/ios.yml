name: iOS prototype

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand

  build:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Environment
        run: |
          xcodebuild -version
          node --version
          bundle exec pod --version
      - name: Native ASS parser and playback clock tests
        run: |
          mkdir -p build/native-tests
          swiftc ios/NeoEPGStation/NeoASSComments.swift ios/NeoEPGStation/NeoCommentLoader.swift tests/native/main.swift -o build/native-tests/comments
          build/native-tests/comments
      - name: Native UI type checks
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swiftc -typecheck -target arm64-apple-ios18.0-simulator -sdk "$sdk" \
            -module-name NeoEPGStation \
            -import-objc-header ios/NeoEPGStation/NeoEPGStation-Bridging-Header.h \
            ios/NeoEPGStation/NeoASSComments.swift ios/NeoEPGStation/NeoCommentLoader.swift \
            ios/NeoEPGStation/NeoDanmakuRenderer.swift ios/NeoEPGStation/NeoCommentOverlay.swift \
            ios/NeoEPGStation/NeoCommentPiP.swift ios/NeoEPGStation/NeoPiPSmoke.swift
          xcrun clang -fsyntax-only -fobjc-arc -target arm64-apple-ios18.0-simulator \
            -isysroot "$sdk" ios/NeoEPGStation/NeoVLCFrameTap.m
      - name: Prepare simulator
        run: python3 scripts/simulator-smoke.py --prepare
      - run: npm ci
      - name: Install pods
        working-directory: ios
        run: bundle exec pod install
      - name: Build device application
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -workspace ios/NeoEPGStation.xcworkspace \
            -scheme NeoEPGStation -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee dist/device-build.log | xcbeautify
      - name: Package LiveContainer IPA
        run: bash scripts/package-ipa.sh
      - name: Build and launch simulator application
        run: |
          set -o pipefail
          xcodebuild -workspace ios/NeoEPGStation.xcworkspace \
            -scheme NeoEPGStation -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            CODE_SIGN_LOCAL_EXECUTION_IDENTITY='Ad Hoc' \
            build 2>&1 | tee dist/simulator-build.log | xcbeautify
          python3 scripts/simulator-smoke.py
      - name: Upload IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoEPGStation-iOS-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/*.json
            dist/*.log
            dist/*.txt
            dist/*.png
            ios/Podfile.lock
            Gemfile.lock
          retention-days: 7
          if-no-files-found: error
