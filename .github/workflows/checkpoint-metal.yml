name: Checkpoint Metal probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint-metal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metal:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/checkpoint/compression-sources
          key: checkpoint-metal-sources-v1-${{ hashFiles('scripts/checkpoint_compression_sources.py') }}
      - name: Run only native compression and preparation checks
        run: |
          set -o pipefail
          mkdir -p dist
          python3 -u scripts/metal-zstd-native-probe.py 2>&1 | tee dist/checkpoint-metal-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-metal-probe-${{ github.run_number }}
          path: |
            dist/checkpoint-metal-probe.log
            dist/metal-zstd-verification.json
